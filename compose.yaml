name: ipr

services:
  app:
    build: .
    image: ipr:1
    ports:
      - "${OUTSIDE_PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      GREETING: ${GREETING}
      STORAGE: ${STORAGE}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:${PORT}/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  data:
